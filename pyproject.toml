[project]
name = "local-llm-accounting"
version = "0.1.0"
description = "Benchmark of local LLM/VLM extraction from accounting documents on Mac mini M4 16 GB"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx",
    "mlx-lm",
    "mlx-vlm",
    "huggingface-hub",
    "pillow",
    "pymupdf",
    "pypdfium2",
    "lxml",
    "pyyaml",
    "pydantic",
    "jsonschema",
    "rapidfuzz",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "psutil",
    "ocrmac",
    "datasets",
    "tqdm",
    "pytest",
    "reportlab>=5.1.0",
]

[tool.uv]
# Supply-chain + reproducibility: nothing published after this date is used.
exclude-newer = "2026-10-27T00:00:00Z"
package = false
